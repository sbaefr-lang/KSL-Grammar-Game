<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 퀴즈 - 예술/체육 활동 단어</title>
<style>
  :root{
    --purple-900:#3b0764;
    --purple-800:#4c1d95;
    --purple-700:#6d28d9;
    --purple-600:#7c3aed;
    --purple-500:#8b5cf6;
    --purple-400:#a78bfa;
    --purple-200:#ddd6fe;
    --purple-100:#ede9fe;
    --purple-50:#f5f3ff;
    --green:#16a34a;
    --green-bg:#dcfce7;
    --red:#dc2626;
    --red-bg:#fee2e2;
    --text-dark:#2e1065;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:linear-gradient(160deg,var(--purple-50) 0%, #efe9ff 60%, #f7f4ff 100%);
    min-height:100vh;
    color:var(--text-dark);
    padding-bottom:40px;
  }
  header{
    text-align:center;
    padding:28px 16px 18px;
  }
  header h1{
    font-size:clamp(22px,5vw,32px);
    margin:0 0 6px;
    color:var(--purple-800);
    letter-spacing:-0.5px;
  }
  header p{
    margin:0;
    color:var(--purple-600);
    font-size:15px;
    font-weight:600;
  }
  .tabs{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:18px auto 8px;
    max-width:520px;
    padding:0 16px;
  }
  .tab-btn{
    flex:1;
    padding:14px 8px;
    border:none;
    border-radius:16px;
    background:var(--white);
    color:var(--purple-700);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(124,58,237,0.12);
    transition:all 0.2s;
  }
  .tab-btn.active{
    background:linear-gradient(135deg,var(--purple-600),var(--purple-800));
    color:#fff;
    box-shadow:0 6px 16px rgba(109,40,217,0.35);
  }
  .panel{ display:none; max-width:560px; margin:0 auto; padding:8px 16px 30px;}
  .panel.active{ display:block; animation:fadeIn 0.3s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* progress bar */
  .progress-wrap{ margin:14px 0 20px; }
  .progress-label{
    display:flex; justify-content:space-between; align-items:center;
    font-size:14px; font-weight:700; color:var(--purple-700); margin-bottom:6px;
  }
  .score-chip{
    background:var(--purple-100); color:var(--purple-800);
    padding:3px 12px; border-radius:20px; font-size:13px;
  }
  .progress-bar-bg{
    width:100%; height:12px; background:var(--purple-100);
    border-radius:20px; overflow:hidden;
  }
  .progress-bar-fill{
    height:100%; background:linear-gradient(90deg,var(--purple-500),var(--purple-700));
    border-radius:20px; transition:width 0.35s ease;
  }

  /* ===== Flashcard ===== */
  .card-stage{
    perspective:1400px;
    width:100%;
    max-width:420px;
    margin:0 auto;
    height:440px;
  }
  .card{
    position:relative;
    width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
  }
  .card.no-anim{ transition:none !important; }
  .card.flipped{ transform:rotateY(180deg); }
  .card-face{
    position:absolute; inset:0;
    border-radius:24px;
    backface-visibility:hidden;
    background:var(--white);
    box-shadow:0 10px 28px rgba(109,40,217,0.18);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:20px;
    border:3px solid var(--purple-200);
    overflow:hidden;
  }
  .card-front img{
    width:100%; max-height:250px; object-fit:contain;
    border-radius:16px; margin-bottom:16px;
    background:var(--purple-50);
  }
  .translate-row{
    display:flex; gap:18px; font-size:19px; font-weight:700; color:var(--purple-800);
  }
  .translate-row span{ display:flex; align-items:center; gap:6px;}
  .card-back{ transform:rotateY(180deg); background:linear-gradient(160deg,var(--purple-700),var(--purple-900)); color:#fff; }
  .back-word{ font-size:clamp(26px,7vw,36px); font-weight:800; margin-bottom:16px; text-align:center;}
  .back-sentence{ font-size:16px; text-align:center; line-height:1.6; background:rgba(255,255,255,0.12); padding:14px 18px; border-radius:14px;}
  .flip-tip{ position:absolute; bottom:12px; font-size:12px; opacity:0.65; }

  .hint-box{
    text-align:center; color:var(--purple-700); font-size:14px; font-weight:600;
    background:var(--purple-100); border-radius:12px; padding:10px 14px; margin-top:14px;
    display:none;
  }
  .hint-box.show{ display:block; }

  .know-row{
    display:none; gap:10px; margin-top:16px;
  }
  .know-row.show{ display:flex; }
  .know-btn, .dontknow-btn{
    flex:1; padding:13px 0; border:none; border-radius:14px;
    font-size:15px; font-weight:700; cursor:pointer;
  }
  .know-btn{ background:var(--green-bg); color:var(--green); }
  .dontknow-btn{ background:var(--red-bg); color:var(--red); }

  .nav-row{
    display:flex; gap:10px; margin-top:16px;
  }
  .nav-btn{
    flex:1; padding:15px 0; border:none; border-radius:16px;
    font-size:15px; font-weight:700; cursor:pointer;
    background:var(--white); color:var(--purple-700);
    box-shadow:0 3px 10px rgba(124,58,237,0.15);
  }
  .nav-btn.primary{ background:linear-gradient(135deg,var(--purple-600),var(--purple-800)); color:#fff; }
  .nav-btn:disabled{ opacity:0.4; cursor:default; }

  /* ===== Quiz ===== */
  .quiz-card{
    background:var(--white); border-radius:24px; padding:20px;
    box-shadow:0 10px 28px rgba(109,40,217,0.15); border:3px solid var(--purple-200);
  }
  .quiz-img-wrap{
    width:100%; height:230px; border-radius:16px; overflow:hidden;
    background:var(--purple-50); margin-bottom:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .quiz-img-wrap img{ width:100%; height:100%; object-fit:contain; }
  .quiz-question{ text-align:center; font-size:17px; font-weight:700; color:var(--purple-800); margin-bottom:14px; }
  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .option-btn{
    padding:16px 8px; border-radius:14px; border:2px solid var(--purple-200);
    background:var(--purple-50); color:var(--text-dark); font-size:16px; font-weight:700;
    cursor:pointer; transition:all 0.15s;
  }
  .option-btn:hover{ background:var(--purple-100); }
  .option-btn.correct{ background:var(--green-bg); border-color:var(--green); color:var(--green); }
  .option-btn.wrong{ background:var(--red-bg); border-color:var(--red); color:var(--red); }
  .option-btn:disabled{ cursor:default; }

  .quiz-hint{
    margin-top:12px; text-align:center; color:var(--red); font-weight:700; font-size:14px; display:none;
  }
  .quiz-hint.show{ display:block; }

  .answer-panel{
    margin-top:16px; background:var(--purple-50); border-radius:16px; padding:16px; text-align:center; display:none;
  }
  .answer-panel.show{ display:block; animation:fadeIn 0.3s ease;}
  .answer-panel .word{ font-size:22px; font-weight:800; color:var(--purple-800); margin-bottom:6px;}
  .answer-panel .trans{ font-size:16px; font-weight:700; color:var(--purple-600); margin-bottom:10px;}
  .answer-panel .sentence{ font-size:14px; color:var(--text-dark); line-height:1.6; }
  .next-q-btn{
    margin-top:14px; width:100%; padding:14px; border:none; border-radius:14px;
    background:linear-gradient(135deg,var(--purple-600),var(--purple-800)); color:#fff;
    font-size:15px; font-weight:700; cursor:pointer; display:none;
  }
  .next-q-btn.show{ display:block; }

  /* result screen */
  .result-screen{ text-align:center; padding:30px 10px; display:none; }
  .result-screen.show{ display:block; }
  .result-emoji{ font-size:60px; }
  .result-score{ font-size:30px; font-weight:800; color:var(--purple-800); margin:10px 0; }
  .result-list{ text-align:left; background:var(--white); border-radius:16px; padding:14px 18px; margin:16px 0; box-shadow:0 6px 16px rgba(109,40,217,0.1); }
  .result-list h4{ margin:0 0 8px; color:var(--purple-700); font-size:14px;}
  .result-list ul{ margin:0; padding-left:20px; color:var(--text-dark); font-size:14px; line-height:1.8; }
  .restart-btn{
    padding:14px 30px; border:none; border-radius:16px; background:linear-gradient(135deg,var(--purple-600),var(--purple-800));
    color:#fff; font-size:15px; font-weight:700; cursor:pointer;
  }
  .stage-wrap{ display:block; }
  .stage-wrap.hidden{ display:none; }
</style>
</head>
<body>

<header>
  <h1>🎨 예술 · 체육 활동 단어 🏃</h1>
  <p>사진을 보고 단어를 배워봐요!</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="flash">🃏 플래시카드</button>
  <button class="tab-btn" data-tab="quiz">🖼️ 그림 퀴즈</button>
</div>

<!-- ================= FLASHCARD PANEL ================= -->
<section class="panel active" id="panel-flash">
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="flash-progress-text">카드 1 / 10</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="flash-progress-fill" style="width:10%"></div></div>
  </div>

  <div class="stage-wrap" id="flash-stage">
    <div class="card-stage">
      <div class="card" id="flash-card">
        <div class="card-face card-front" id="flash-front">
          <img id="flash-img" src="" alt="단어 사진">
          <div class="translate-row">
            <span>🇺🇸 <b id="flash-en"></b></span>
            <span>🇯🇵 <b id="flash-ja"></b></span>
          </div>
        </div>
        <div class="card-face card-back">
          <div class="back-word" id="flash-kr"></div>
          <div class="back-sentence" id="flash-sentence"></div>
          <div class="flip-tip">카드를 다시 눌러 사진을 볼 수 있어요</div>
        </div>
      </div>
    </div>

    <div class="hint-box" id="flash-hint"></div>

    <div class="know-row" id="flash-know-row">
      <button class="dontknow-btn" onclick="answerFlash(false)">👎 몰랐어요</button>
      <button class="know-btn" onclick="answerFlash(true)">👍 알고 있었어요</button>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="flash-prev" onclick="prevFlash()">← 이전</button>
      <button class="nav-btn" onclick="toggleHint()">💡 힌트</button>
      <button class="nav-btn primary" id="flash-next" onclick="nextFlash()">다음 →</button>
    </div>
  </div>

  <div class="result-screen" id="flash-result">
    <div class="result-emoji">🎉</div>
    <div>플래시카드를 다 봤어요!</div>
    <div class="result-score" id="flash-result-score"></div>
    <div class="result-list" id="flash-result-list" style="display:none;">
      <h4>다시 확인해봐요 👀</h4>
      <ul id="flash-dontknow-ul"></ul>
    </div>
    <button class="restart-btn" onclick="restartFlash()">🔄 다시 하기</button>
  </div>
</section>

<!-- ================= QUIZ PANEL ================= -->
<section class="panel" id="panel-quiz">
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="quiz-progress-text">문제 1 / 10</span>
      <span class="score-chip" id="quiz-score-chip">점수 0</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="quiz-progress-fill" style="width:10%"></div></div>
  </div>

  <div class="stage-wrap" id="quiz-stage">
    <div class="quiz-card">
      <div class="quiz-img-wrap"><img id="quiz-img" src="" alt="문제 사진"></div>
      <div class="quiz-question">이 사진은 어떤 단어일까요?</div>
      <div class="options" id="quiz-options"></div>
      <div class="quiz-hint" id="quiz-hint"></div>

      <div class="answer-panel" id="quiz-answer">
        <div class="word" id="quiz-answer-word"></div>
        <div class="trans" id="quiz-answer-trans"></div>
        <div class="sentence" id="quiz-answer-sentence"></div>
      </div>
      <button class="next-q-btn" id="quiz-next-btn" onclick="nextQuiz()">다음 문제 →</button>
    </div>
  </div>

  <div class="result-screen" id="quiz-result">
    <div class="result-emoji">🏆</div>
    <div>퀴즈가 끝났어요!</div>
    <div class="result-score" id="quiz-result-score"></div>
    <button class="restart-btn" onclick="restartQuiz()">🔄 다시 하기</button>
  </div>
</section>

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

/* ==================================================
   FLASHCARD LOGIC
================================================== */
let flashOrder = WORDS.map((_,i)=>i);
let flashIdx = 0;
let flashResults = {}; // idx -> true/false
let flashAnswered = false;

const cardEl = document.getElementById('flash-card');
cardEl.addEventListener('click', (e)=>{
  cardEl.classList.toggle('flipped');
  if(cardEl.classList.contains('flipped')){
    document.getElementById('flash-know-row').classList.add('show');
  } else {
    document.getElementById('flash-know-row').classList.remove('show');
  }
});

function renderFlash(noAnim){
  const w = WORDS[flashOrder[flashIdx]];
  if(noAnim){ cardEl.classList.add('no-anim'); }
  cardEl.classList.remove('flipped');
  document.getElementById('flash-know-row').classList.remove('show');
  document.getElementById('flash-hint').classList.remove('show');
  document.getElementById('flash-hint').textContent = '';

  document.getElementById('flash-img').src = w.img;
  document.getElementById('flash-en').textContent = w.en;
  document.getElementById('flash-ja').textContent = w.ja;
  document.getElementById('flash-kr').textContent = w.kr;
  document.getElementById('flash-sentence').textContent = w.sentence;

  document.getElementById('flash-progress-text').textContent = `카드 ${flashIdx+1} / ${WORDS.length}`;
  document.getElementById('flash-progress-fill').style.width = `${((flashIdx+1)/WORDS.length)*100}%`;
  updateFlashScoreChip();

  document.getElementById('flash-prev').disabled = (flashIdx===0);
  document.getElementById('flash-next').textContent = (flashIdx===WORDS.length-1) ? '결과 보기 🎉' : '다음 →';

  if(noAnim){
    requestAnimationFrame(()=>{ cardEl.classList.remove('no-anim'); });
  }
}

function updateFlashScoreChip(){
  const know = Object.values(flashResults).filter(v=>v===true).length;
  const dontknow = Object.values(flashResults).filter(v=>v===false).length;
}

function toggleHint(){
  const w = WORDS[flashOrder[flashIdx]];
  const box = document.getElementById('flash-hint');
  if(box.classList.contains('show')){
    box.classList.remove('show');
  } else {
    box.textContent = '💡 ' + w.hint;
    box.classList.add('show');
  }
}

function answerFlash(know){
  flashResults[flashOrder[flashIdx]] = know;
  goNextFlashCard();
}

function nextFlash(){
  if(!(flashOrder[flashIdx] in flashResults)){
    flashResults[flashOrder[flashIdx]] = true; // 자동으로 "알고 있어요" 처리
  }
  goNextFlashCard();
}

function goNextFlashCard(){
  updateFlashScoreChip();
  if(flashIdx < WORDS.length-1){
    flashIdx++;
    renderFlash(true);
  } else {
    showFlashResult();
  }
}

function prevFlash(){
  if(flashIdx>0){
    flashIdx--;
    renderFlash(true);
  }
}

function showFlashResult(){
  document.getElementById('flash-stage').style.display='none';
  const result = document.getElementById('flash-result');
  result.classList.add('show');
  const know = Object.values(flashResults).filter(v=>v===true).length;
  document.getElementById('flash-result-score').textContent = `👍 알고 있었어요: ${know} / ${WORDS.length}`;
  const dontknowIdx = Object.keys(flashResults).filter(k=>flashResults[k]===false);
  if(dontknowIdx.length>0){
    document.getElementById('flash-result-list').style.display='block';
    document.getElementById('flash-dontknow-ul').innerHTML =
      dontknowIdx.map(i=>`<li>${WORDS[i].kr} (${WORDS[i].en})</li>`).join('');
  }
}

function restartFlash(){
  flashIdx = 0;
  flashResults = {};
  document.getElementById('flash-stage').style.display='block';
  document.getElementById('flash-result').classList.remove('show');
  document.getElementById('flash-result-list').style.display='none';
  renderFlash(true);
}

renderFlash(true);

/* ==================================================
   QUIZ LOGIC
================================================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let quizOrder = shuffle(WORDS.map((_,i)=>i));
let quizIdx = 0;
let quizScore = 0;
let quizSolved = false;

function buildOptions(correctIdx){
  const others = WORDS.map((_,i)=>i).filter(i=>i!==correctIdx);
  const distractors = shuffle(others).slice(0,3);
  return shuffle([correctIdx, ...distractors]);
}

let currentOptions = [];

function renderQuiz(){
  quizSolved = false;
  const wIdx = quizOrder[quizIdx];
  const w = WORDS[wIdx];
  currentOptions = buildOptions(wIdx);

  document.getElementById('quiz-img').src = w.img;
  document.getElementById('quiz-progress-text').textContent = `문제 ${quizIdx+1} / ${WORDS.length}`;
  document.getElementById('quiz-progress-fill').style.width = `${((quizIdx+1)/WORDS.length)*100}%`;
  document.getElementById('quiz-score-chip').textContent = `점수 ${quizScore}`;
  document.getElementById('quiz-hint').classList.remove('show');
  document.getElementById('quiz-answer').classList.remove('show');
  document.getElementById('quiz-next-btn').classList.remove('show');

  const optWrap = document.getElementById('quiz-options');
  optWrap.innerHTML = '';
  currentOptions.forEach(optIdx=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = WORDS[optIdx].kr;
    btn.onclick = ()=>selectOption(optIdx, wIdx, btn);
    optWrap.appendChild(btn);
  });
}

function selectOption(optIdx, correctIdx, btnEl){
  if(quizSolved) return;
  if(optIdx === correctIdx){
    quizSolved = true;
    quizScore++;
    btnEl.classList.add('correct');
    document.querySelectorAll('.option-btn').forEach(b=>b.disabled=true);
    const w = WORDS[correctIdx];
    document.getElementById('quiz-answer-word').textContent = w.kr;
    document.getElementById('quiz-answer-trans').textContent = `🇺🇸 ${w.en}   🇯🇵 ${w.ja}`;
    document.getElementById('quiz-answer-sentence').textContent = w.sentence;
    document.getElementById('quiz-answer').classList.add('show');
    document.getElementById('quiz-next-btn').classList.add('show');
    document.getElementById('quiz-score-chip').textContent = `점수 ${quizScore}`;
  } else {
    btnEl.classList.add('wrong');
    btnEl.disabled = true;
    const w = WORDS[correctIdx];
    document.getElementById('quiz-hint').textContent = '💡 ' + w.hint + ' 다시 골라보세요!';
    document.getElementById('quiz-hint').classList.add('show');
  }
}

function nextQuiz(){
  if(quizIdx < WORDS.length-1){
    quizIdx++;
    renderQuiz();
  } else {
    showQuizResult();
  }
}

function showQuizResult(){
  document.getElementById('quiz-stage').style.display='none';
  document.getElementById('quiz-result').classList.add('show');
  document.getElementById('quiz-result-score').textContent = `${quizScore} / ${WORDS.length} 정답!`;
}

function restartQuiz(){
  quizOrder = shuffle(WORDS.map((_,i)=>i));
  quizIdx = 0;
  quizScore = 0;
  document.getElementById('quiz-stage').style.display='block';
  document.getElementById('quiz-result').classList.remove('show');
  renderQuiz();
}

renderQuiz();
</script>
